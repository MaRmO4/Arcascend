<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ArcAscend — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #0f1419; color: #e6e9ed;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  .card {
    background: #1a2129; border: 1px solid #2d3742;
    border-radius: 16px; padding: 40px; width: 100%;
    max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .logo {
    font-size: 26px; font-weight: 800;
    text-align: center; margin-bottom: 6px;
    background: linear-gradient(135deg, #4f9eff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline { text-align: center; color: #8b95a1; font-size: 13px; margin-bottom: 32px; }
  label { display: block; font-size: 12px; color: #8b95a1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input { width: 100%; background: #232c36; border: 1px solid #2d3742; color: #e6e9ed; padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 18px; outline: none; }
  input:focus { border-color: #4f9eff; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .opt { text-transform: none; letter-spacing: 0; color: #6b7480; font-size: 11px; }
  .btn { width: 100%; background: #4f9eff; color: white; border: none; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
  .btn.secondary { background: #232c36; border: 1px solid #2d3742; color: #e6e9ed; }
  .message { text-align: center; font-size: 13px; margin-top: 14px; min-height: 20px; }
  .message.error { color: #ef4444; }
  .message.success { color: #22c55e; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">ArcAscend</div>
  <div class="tagline">CRM for Personal Trainers</div>

  <!-- LOGIN PANEL -->
  <div id="login-panel">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" />
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') logIn()" />
    <button class="btn" onclick="logIn()">Log In</button>
    <button class="btn secondary" onclick="showSignup()">Create Account</button>
  </div>

  <!-- SIGNUP PANEL -->
  <div id="signup-panel" style="display:none">
    <div class="row">
      <div><label>First name</label><input type="text" id="su-first" placeholder="Jane" /></div>
      <div><label>Last name</label><input type="text" id="su-last" placeholder="Doe" /></div>
    </div>
    <label>Username</label>
    <input type="text" id="su-username" placeholder="janedoe" />
    <label>Email</label>
    <input type="email" id="su-email" placeholder="you@example.com" />
    <label>Password</label>
    <input type="password" id="su-password" placeholder="••••••••" />
    <label>Organization join code <span class="opt">(optional)</span></label>
    <input type="text" id="su-code" placeholder="ORG-XXXX-XXXX" style="text-transform:uppercase" />
    <button class="btn" onclick="signUp()">Create Account</button>
    <button class="btn secondary" onclick="showLogin()">← Back to login</button>
  </div>

  <div class="message" id="msg"></div>
</div>

<script>
  var SUPABASE_URL = 'https://udzfpeztwgsynjhwjwic.supabase.co'
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkemZwZXp0d2dzeW5qaHdqd2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTcwOTcsImV4cCI6MjA5NTI3MzA5N30.Eke_HxZtww3zVekkPMDydT90NkVWSltJjA2fr40oquQ'

  // ---- Panel toggle (login <-> signup) ----
  function showSignup() {
    document.getElementById('login-panel').style.display = 'none'
    document.getElementById('signup-panel').style.display = 'block'
    setMsg('', '')
  }
  function showLogin() {
    document.getElementById('signup-panel').style.display = 'none'
    document.getElementById('login-panel').style.display = 'block'
    setMsg('', '')
  }
  function setMsg(cls, text) {
    var msg = document.getElementById('msg')
    msg.className = 'message' + (cls ? ' ' + cls : '')
    msg.textContent = text || ''
  }

  // Store the session exactly like logIn() does.
  function storeSession(data) {
    localStorage.clear()
    localStorage.setItem('arcascend_token', data.access_token)
    localStorage.setItem('arcascend_refresh_token', data.refresh_token)
    localStorage.setItem('arcascend_token_expires_at', String(Date.now() + (data.expires_in || 3600) * 1000))
    localStorage.setItem('arcascend_user_id', data.user.id)
    localStorage.setItem('arcascend_user_email', data.user.email)
  }

  async function signUp() {
    var username  = document.getElementById('su-username').value.trim()
    var email     = document.getElementById('su-email').value.trim()
    var password  = document.getElementById('su-password').value
    var firstName = document.getElementById('su-first').value.trim()
    var lastName  = document.getElementById('su-last').value.trim()
    var joinCode  = document.getElementById('su-code').value.trim().toUpperCase()

    // a. Client-side validation.
    if (!username || !email || !password || !firstName || !lastName) {
      setMsg('error', 'Please fill in username, email, password, first and last name.')
      return
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setMsg('error', 'Please enter a valid email address.')
      return
    }

    setMsg('', 'Creating account...')

    // b + c. Sign up, with GoTrue-shaped error handling + network/JSON guard.
    var data
    try {
      var res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        },
        body: JSON.stringify({ email: email, password: password })
      })
      try { data = await res.json() } catch (e) { data = null }
      if (res.status >= 400 || !data || !data.access_token) {
        var m = (data && (data.msg || data.error_description || data.error_code || data.error)) || 'Sign up failed'
        setMsg('error', typeof m === 'string' ? m : 'Sign up failed')
        return
      }
    } catch (e) {
      setMsg('error', 'Network error — could not reach the server. Please try again.')
      return
    }

    // d. Success: establish the session immediately (email confirmation is OFF).
    storeSession(data)

    // Insert the profile row with the USER's token (so auth.uid() = user_id).
    // Non-fatal: the account already exists if this fails.
    var profileWarning = ''
    try {
      var pRes = await fetch(SUPABASE_URL + '/rest/v1/profiles', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + data.access_token,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          user_id: data.user.id, username: username,
          first_name: firstName, last_name: lastName, email: email
        })
      })
      if (!(pRes.ok || pRes.status === 201 || pRes.status === 204)) {
        var pt = await pRes.text()
        console.warn('Profile insert failed:', pRes.status, pt)
        profileWarning = ' (profile details couldn’t be saved — you can set them later)'
      }
    } catch (e) {
      console.warn('Profile insert error:', e)
      profileWarning = ' (profile details couldn’t be saved — you can set them later)'
    }

    // Optional org join. Invalid code must NOT fail the signup.
    var joinNote = ''
    if (joinCode) {
      try {
        var jRes = await fetch(SUPABASE_URL + '/rest/v1/rpc/join_org', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + data.access_token
          },
          body: JSON.stringify({ p_code: joinCode })
        })
        if (jRes.ok) {
          var jData = null
          try { jData = await jRes.json() } catch (e) { jData = null }
          var row = Array.isArray(jData) ? jData[0] : jData
          joinNote = (row && row.joined_org_name) ? (' Joined ' + row.joined_org_name + '.') : ' Joined your team.'
        } else {
          console.warn('join_org failed:', jRes.status)
          joinNote = ' But that join code was invalid — you can add one later in settings.'
        }
      } catch (e) {
        console.warn('join_org error:', e)
        joinNote = ' But that join code couldn’t be verified — you can add one later in settings.'
      }
    }

    // e. Always resolve: success message + redirect.
    setMsg('success', 'Account created!' + joinNote + profileWarning + ' Redirecting...')
    setTimeout(function () { window.location.href = 'index.html' }, 1000)
  }

  function logIn() {
    var email = document.getElementById('email').value
    var password = document.getElementById('password').value
    var msg = document.getElementById('msg')
    msg.className = 'message'
    msg.textContent = 'Logging in...'

    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r) { return r.json() })
    .then(function(data) {
      if (data.error || !data.access_token) {
        msg.className = 'message error'
        msg.textContent = data.error_description || data.error || 'Login failed'
      } else {
        localStorage.clear()
        localStorage.setItem('arcascend_token', data.access_token)
        localStorage.setItem('arcascend_refresh_token', data.refresh_token)
        localStorage.setItem('arcascend_token_expires_at', String(Date.now() + (data.expires_in || 3600) * 1000))
        localStorage.setItem('arcascend_user_id', data.user.id)
        localStorage.setItem('arcascend_user_email', data.user.email)
        msg.className = 'message success'
        msg.textContent = 'Success! Redirecting...'
        setTimeout(function() { window.location.href = 'index.html' }, 1000)
      }
    })
  }
</script>
</body>
</html>
